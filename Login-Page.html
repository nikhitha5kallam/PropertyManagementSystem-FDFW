                </td>

            </tr>

        <hr>

        <h2 style="color:black; text-align:center">
            LOGIN
        </h2>


        <section align="center">

            <form id="loginForm" style="font-size:22px;">

                <label>
                    <b>Login As:</b>
                </label>

                <br><br>


                <input type="radio"
                       name="role"
                       value="admin">

                <label>
                    Admin
                </label>


                <input type="radio"
                       name="role"
                       value="tenant">

                <label>
                    Tenant
                </label>


                <input type="radio"
                       name="role"
                       value="owner">

                <label>
                    Property Owner
                </label>

                <br><br><br>


                <label>
                    Email:
                </label>

                <br>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       style="width:350px; height:35px;">

                <br><br>


                <label>
                    Password:
                </label>

                <br>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter your password"
                       style="width:350px; height:35px;">

                <br><br><br>


                <input type="submit"
                       value="LOGIN"
                       style="font-size:20px; padding:10px 35px;">

            </form>


            <br><br>


            <p style="font-size:20px;">

                Don't have an account?

                <a href="Register-Page.html">
                    Register
                </a>

            </p>

        </section>


        <hr>


        <table width="100%">

            <tr>

                <td align="left">

                    <img src="logo-project.png"
                         width="180"
                         height="100">

                </td>

                <td align="center">

                    <a href="#">ABOUT</a>

                    <a href="#">CONTACT</a>

                </td>

            </tr>

        </table>
<script>

    let adminEmail = "nikhitha.kallam@gmail.com";
    let adminPassword = "admin123";

    let loginForm = document.getElementById("loginForm");


    loginForm.addEventListener("submit", function(event)
    {
        event.preventDefault();


        let email = document.getElementById("email").value.trim();

        let password = document.getElementById("password").value.trim();

        let role = document.querySelector('input[name="role"]:checked');


        if(role == null)
        {
            alert("Please select your role!");
            return;
        }


        /* ADMIN LOGIN */

        if(role.value == "admin")
        {
            if(email === adminEmail &&
               password === adminPassword)
            {
                alert("Admin Login Successful!");

                window.location.href = "Admin-Page.html";
            }
            else
            {
                alert("Invalid Admin Email or Password!");
            }
        }


        /* TENANT / OWNER LOGIN */

        else
        {
            let users = JSON.parse(localStorage.getItem("users")) || [];


            let user = users.find(function(user)
            {
                return user.email == email &&
                       user.password == password &&
                       user.role == role.value;
            });


            if(user)
            {
                /* Remember the logged-in user */

                localStorage.setItem("currentUser", user.email);


                if(role.value == "owner")
                {
                    alert("Property Owner Login Successful!");

                    window.location.href = "Owner.html";
                }


                else if(role.value == "tenant")
                {
                    alert("Tenant Login Successful!");

                    window.location.href = "Tenant-Page.html";
                }
            }


            else
            {
                alert("Invalid Email, Password, or Role!");
            }
        }

    });

</script>
    </body>
