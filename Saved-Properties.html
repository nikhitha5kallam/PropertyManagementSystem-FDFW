<h1 align="center">❤️ MY SAVED PROPERTIES</h1>

    Properties that you have saved.
</p>

<script>


let currentUser =
    localStorage.getItem("currentUser");


if(currentUser == null)
{

    alert("Please login first!");

    window.location.href =
        "Login-Page.html";

}


let savedProperties =
    JSON.parse(
        localStorage.getItem("savedProperties")
    ) || [];


let myProperties =
    savedProperties.filter(function(property)
    {

        return property.email == currentUser;

    });


let container =
    document.getElementById(
        "savedPropertiesContainer"
    );


if(myProperties.length == 0)
{

    container.innerHTML =
        "<h2 align='center'>" +
        "You have no saved properties." +
        "</h2>";

}


myProperties.forEach(function(property)
{

    let propertyBox =
        document.createElement("div");


    propertyBox.style.width = "70%";

    propertyBox.style.margin =
        "30px auto";

    propertyBox.style.padding =
        "20px";

    propertyBox.style.backgroundColor =
        "rgba(255,255,255,0.85)";

    propertyBox.style.textAlign =
        "center";


    propertyBox.innerHTML =

        "<img src='" +
        property.photo +
        "' width='250' height='200'>" +

        "<h2>" +
        property.propertyName +
        "</h2>" +

        "<p style='font-size:18px;'>" +

        "<b>Location:</b> " +
        property.location +

        "</p>" +

        "<p style='font-size:18px;'>" +

        "<b>Rent:</b> " +
        property.rent +

        "</p>" +

        "<br>" +

        "<button onclick='removeProperty(\"" +
        property.propertyName +
        "\")'>" +

        "REMOVE PROPERTY" +

        "</button>";


    container.appendChild(propertyBox);

});



function removeProperty(propertyName)
{

    let savedProperties =
        JSON.parse(
            localStorage.getItem("savedProperties")
        ) || [];


    savedProperties =
        savedProperties.filter(function(property)
        {

            return !(
                property.email == currentUser &&
                property.propertyName == propertyName
            );

        });


    localStorage.setItem(
        "savedProperties",
        JSON.stringify(savedProperties)
    );


    alert("Property removed from saved properties!");

    location.reload();

}



function goBack()
{

    window.location.href =
        "Tenant-Page.html";

}


</script>
