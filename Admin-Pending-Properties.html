<!DOCTYPE html>

<html>

<head>

    <title>PMS - Pending Properties</title>

</head>


<body style="background-image:url('project-background1.avif');">


    <!-- Header -->

    <table width="100%">

        <tr>

            <td align="left">

                <img src="logo-project.png"
                     width="180"
                     height="100">

            </td>


            <td align="right">

                <a href="PropertyManagementSystem.html">
                    HOME
                </a>

                &nbsp;&nbsp;

                <a href="Admin-Page.html">
                    ADMIN
                </a>

                &nbsp;&nbsp;

                <a href="Login-Page.html">
                    LOGOUT
                </a>

            </td>

        </tr>

    </table>


    <hr>


    <!-- Heading -->

    <h1 align="center">

        PENDING PROPERTIES

    </h1>


    <p align="center" style="font-size:20px;">

        Review properties submitted by Property Owners.

    </p>


    <br>


    <!-- Property Container -->

    <div id="propertyContainer">

    </div>


    <br>


    <!-- Back Button -->

    <div align="center">

        <button onclick="goBack()"
                style="font-size:18px; padding:10px 25px;">

            BACK TO ADMIN

        </button>

    </div>


    <br>

    <hr>


    <!-- Footer -->

    <table width="100%">

        <tr>

            <td align="left">

                <img src="logo-project.png"
                     width="180"
                     height="100">

            </td>


            <td align="center">

                <a href="#">
                    ABOUT
                </a>

                &nbsp;&nbsp;

                <a href="#">
                    CONTACT
                </a>

            </td>

        </tr>

    </table>


    <!-- JavaScript -->

    <script>


        /* Get properties from localStorage */

        let properties =
            JSON.parse(localStorage.getItem("properties")) || [];


        let container =
            document.getElementById("propertyContainer");


        /* Get only Pending properties */

        let pendingProperties =
            properties.filter(function(property)
            {
                return property.status == "Pending";
            });


        /* No pending properties */

        if(pendingProperties.length == 0)
        {
            container.innerHTML =

                "<h2 align='center'>" +
                "No pending properties found." +
                "</h2>";
        }


        /* Display pending properties */

        pendingProperties.forEach(function(property)
        {

            let propertyBox =
                document.createElement("div");


            propertyBox.style.width = "70%";

            propertyBox.style.margin =
                "30px auto";

            propertyBox.style.padding =
                "20px";

            propertyBox.style.backgroundColor =
                "rgba(255,255,255,0.85)";

            propertyBox.style.textAlign =
                "center";


            propertyBox.innerHTML =


                "<img src='" +
                property.photo +
                "' width='250' height='180'>" +


                "<h2>" +
                property.propertyName +
                "</h2>" +


                "<p>" +
                "<b>Location:</b> " +
                property.location +
                "</p>" +


                "<p>" +
                "<b>Property Type:</b> " +
                property.propertyType +
                "</p>" +


                "<p>" +
                "<b>Area:</b> " +
                property.area +
                " " +
                property.areaUnit +
                "</p>" +


                "<p>" +
                "<b>Monthly Rent:</b> ₹" +
                property.rent +
                "</p>" +


                "<p>" +
                "<b>Bedrooms:</b> " +
                property.bedrooms +
                "</p>" +


                "<p>" +
                "<b>Bathrooms:</b> " +
                property.bathrooms +
                "</p>" +


                "<p>" +
                "<b>Description:</b> " +
                property.description +
                "</p>" +


                "<p>" +
                "<b>Status:</b> Pending" +
                "</p>" +


                "<br>" +


                "<button onclick='approveProperty(" +
                property.id +
                ")'>" +

                "APPROVE" +

                "</button>" +


                "&nbsp;&nbsp;&nbsp;" +


                "<button onclick='rejectProperty(" +
                property.id +
                ")'>" +

                "REJECT" +

                "</button>";


            container.appendChild(propertyBox);

        });



        /* =========================
           APPROVE PROPERTY
           ========================= */

        function approveProperty(id)
        {

            let properties =
                JSON.parse(
                    localStorage.getItem("properties")
                ) || [];


            let property =
                properties.find(function(property)
                {
                    return property.id == id;
                });


            if(property)
            {

                property.status = "Approved";


                localStorage.setItem(
                    "properties",
                    JSON.stringify(properties)
                );


                alert(
                    "Property Approved Successfully!"
                );


                location.reload();

            }

        }



        /* =========================
           REJECT PROPERTY
           ========================= */

        function rejectProperty(id)
        {

            let properties =
                JSON.parse(
                    localStorage.getItem("properties")
                ) || [];


            let property =
                properties.find(function(property)
                {
                    return property.id == id;
                });


            if(property)
            {

                property.status = "Rejected";


                localStorage.setItem(
                    "properties",
                    JSON.stringify(properties)
                );


                alert(
                    "Property Rejected!"
                );


                location.reload();

            }

        }



        /* =========================
           BACK TO ADMIN
           ========================= */

        function goBack()
        {

            window.location.href =
                "Admin-Page.html";

        }


    </script>


</body>

</html>
