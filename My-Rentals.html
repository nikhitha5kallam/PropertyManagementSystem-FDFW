<h1 align="center">🏠 MY RENTALS</h1>

<p align="center" style="font-size:20px;">
    View your rented properties and rental information.
</p>

<br>


<div id="rentalsContainer"></div>


<br><br>


<div align="center">

<button onclick="goBack()"
        style="font-size:18px; padding:10px 25px;">

    BACK TO TENANT

</button>

</div>


<br>

<hr>


<table width="100%">

<tr>

<td align="left">

<img src="logo-project.png"
     width="180"
     height="100">

</td>

<td align="center">

<a href="#">ABOUT</a>
&nbsp;&nbsp;

<a href="#">CONTACT</a>

</td>

</tr>

<script>


let currentUser =
    localStorage.getItem("currentUser");


if(currentUser == null)
{

    alert("Please login first!");

    window.location.href =
        "Login-Page.html";

}


let rentals =
    JSON.parse(
        localStorage.getItem("rentals")
    ) || [];


let myRentals =
    rentals.filter(function(rental)
    {

        return rental.email == currentUser;

    });


let container =
    document.getElementById(
        "rentalsContainer"
    );


if(myRentals.length == 0)
{

    container.innerHTML =

        "<h2 align='center'>" +
        "You currently have no rented properties." +
        "</h2>" +

        "<p align='center' style='font-size:18px;'>" +
        "Your rental information will appear here." +
        "</p>";

}


myRentals.forEach(function(rental)
{

    let rentalBox =
        document.createElement("div");


    rentalBox.style.width = "70%";

    rentalBox.style.margin =
        "30px auto";

    rentalBox.style.padding =
        "20px";

    rentalBox.style.backgroundColor =
        "rgba(255,255,255,0.85)";

    rentalBox.style.textAlign =
        "center";


    rentalBox.innerHTML =

        "<h2>" +
        rental.propertyName +
        "</h2>" +

        "<p style='font-size:18px;'>" +

        "<b>Location:</b> " +
        rental.location +

        "</p>" +

        "<p style='font-size:18px;'>" +

        "<b>Monthly Rent:</b> " +
        rental.rent +

        "</p>" +

        "<p style='font-size:18px;'>" +

        "<b>Rental Start Date:</b> " +
        rental.startDate +

        "</p>" +

        "<p style='font-size:18px;'>" +

        "<b>Rental Status:</b> " +
        rental.status +

        "</p>";


    container.appendChild(rentalBox);

});



function goBack()
{

    window.location.href =
        "Tenant-Page.html";

}


</script>


</body>

</html>
