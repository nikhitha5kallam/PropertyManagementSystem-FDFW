<!DOCTYPE html>

<html>

<head>

    <title>PMS - Admin Dashboard</title>

</head>


<body style="background-image:url(project-background1.avif);">


    <!-- Header -->

    <table width="100%">

        <tr>

            <td align="left">

                <img src="logo-project.png"
                     width="180"
                     height="100">

            </td>


            <td align="right">

                <a href="PropertyManagementSystem.html">
                    HOME
                </a>

                &nbsp;&nbsp;


                <a href="Admin-Approved-Properties.html">
                    PROPERTIES
                </a>

                &nbsp;&nbsp;


                <a href="Login-Page.html">
                    LOGOUT
                </a>

            </td>

        </tr>

    </table>


    <hr>


    <!-- Admin Dashboard -->

    <h1 style="text-align:center;">

        ADMIN DASHBOARD

    </h1>


    <p style="text-align:center; font-size:20px;">

        Welcome Admin!

    </p>


    <br>


    <!-- Dashboard Statistics -->

    <table border="1"
           width="80%"
           align="center"
           cellpadding="20">

        <tr>

            <th>
                USERS
            </th>

            <th>
                PROPERTIES
            </th>

            <th>
                PENDING
            </th>

        </tr>


        <tr align="center">

            <td id="totalUsers">
                0
            </td>

            <td id="totalProperties">
                0
            </td>

            <td id="totalPending">
                0
            </td>

        </tr>

    </table>


    <br>
    <br>


    <!-- User Management -->

    <h2 style="text-align:center;">

        USER MANAGEMENT

    </h2>


    <p style="text-align:center;">

        <button onclick="viewUsers()">

            VIEW USERS

        </button>

    </p>


    <br>


    <!-- Property Management -->

    <h2 style="text-align:center;">

        PROPERTY MANAGEMENT

    </h2>


    <p style="text-align:center;">

        <button onclick="pendingProperties()">

            PENDING PROPERTIES

        </button>


        &nbsp;&nbsp;


        <button onclick="approvedProperties()">

            APPROVED PROPERTIES

        </button>

    </p>


    <br>


    <!-- Reports -->

    <h2 style="text-align:center;">

        REPORTS

    </h2>


    <p style="text-align:center;">

        <button onclick="viewReports()">

            VIEW REPORTS

        </button>

    </p>


    <br>
    <br>


    <!-- Logout -->

    <div style="text-align:center;">

        <button onclick="logout()"
                style="font-size:18px; padding:10px 30px;">

            LOGOUT

        </button>

    </div>


    <br>


    <hr>


    <!-- Footer -->

    <table width="100%">

        <tr>

            <td align="left">

                <img src="logo-project.png"
                     width="180"
                     height="100">

            </td>


            <td align="center">

                <a href="#">
                    ABOUT
                </a>

                &nbsp;&nbsp;


                <a href="#">
                    CONTACT
                </a>

            </td>

        </tr>

    </table>


    <!-- JavaScript -->

    <script>


        /* =========================
           DASHBOARD STATISTICS
           ========================= */


        let users =
            JSON.parse(localStorage.getItem("users")) || [];


        let properties =
            JSON.parse(localStorage.getItem("properties")) || [];


        let pending =
            properties.filter(function(property)
            {
                return property.status == "Pending";
            });


        document.getElementById("totalUsers").innerHTML =
            users.length;


        document.getElementById("totalProperties").innerHTML =
            properties.length;


        document.getElementById("totalPending").innerHTML =
            pending.length;



        /* =========================
           VIEW USERS
           ========================= */


        function viewUsers()
        {
            window.location.href = "Admin-Users.html";
        }



        /* =========================
           PENDING PROPERTIES
           ========================= */


        function pendingProperties()
        {
            window.location.href =
                "Admin-Pending-Properties.html";
        }



        /* =========================
           APPROVED PROPERTIES
           ========================= */


        function approvedProperties()
        {
            window.location.href =
                "Admin-Approved-Properties.html";
        }



        /* =========================
           REPORTS
           ========================= */


        function viewReports()
        {
            window.location.href =
                "Admin-Reports.html";
        }



        /* =========================
           LOGOUT
           ========================= */


        function logout()
        {
            localStorage.removeItem("currentUser");

            alert("Admin Logged Out!");

            window.location.href =
                "Login-Page.html";
        }


    </script>


</body>

</html>
